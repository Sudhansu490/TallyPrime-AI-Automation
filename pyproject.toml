[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-automation"
version = "0.1.0"
description = "AI-assisted purchase invoice and bank statement processing for TallyPrime, with human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "streamlit>=1.40",
]

[project.optional-dependencies]
# Document processing stack. Already present in tally_env; pinned here for
# reproducibility. Version alignment (protobuf / OpenCV) is revisited in Phase 3.
ocr = [
    "pymupdf>=1.24",
    "pillow>=10",
    "paddlepaddle==2.6.2",
    "paddleocr==2.9.1",
    "numpy<2",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:paddle.*",
]
