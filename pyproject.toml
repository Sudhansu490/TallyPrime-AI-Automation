[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-automation"
version = "0.1.0"
description = "AI-assisted purchase invoice and bank statement processing for TallyPrime, with human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",   # multipart/form-data parsing for uploads
    "pymupdf>=1.24,<1.25",        # PDF structure validation (Phase 2), text extraction (Phase 3)
    "pillow>=10",                 # image validation (Phase 2), OCR preprocessing (Phase 3)
]

[project.optional-dependencies]
# OCR stack (Phase 3), already present in tally_env. CPU only. paddleocr 2.9.1
# also pulls opencv-python, opencv-contrib-python and (via albumentations)
# opencv-python-headless; they share one cv2 module. See README "Known issues".
ocr = [
    "paddlepaddle==2.6.2",
    "paddleocr==2.9.1",
    "numpy<2",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# HTML templates and static assets are served from inside the package.
tally_automation = ["frontend/templates/*.html", "frontend/static/**/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "ocr: runs the real PaddleOCR engine on CPU (slow; deselect with -m 'not ocr')",
]
filterwarnings = [
    "ignore::DeprecationWarning:paddle.*",
]
